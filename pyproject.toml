[project]
name = "reps-for-claude"
version = "0.1.0"
description = "Earn Claude Code time by doing exercise reps counted on your webcam"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12"]

[project.scripts]
reps = "reps_for_claude.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reps_for_claude"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
