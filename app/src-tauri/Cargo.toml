[workspace]
members = ["engine", "hub-client", "reps-cli"]

[package]
name = "app"
version = "0.1.0"
description = "Local movement detection and workout breaks"
authors = ["RFP contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Serves the embedded frontend instead of the dev server. `tauri build` passes
# this; a plain `cargo build --release` does not, and without it the packaged
# app loads devUrl and shows "Connection refused". DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
url = "2"
reps-cli = { path = "reps-cli" }
libc = "0.2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
engine = { path = "engine" }
hub-client = { path = "hub-client" }
