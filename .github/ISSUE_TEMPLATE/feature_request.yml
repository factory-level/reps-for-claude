name: Feature request
description: Suggest something RFP should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Does this fit RFP's constraints?
      options:
        - label: It does not require video or frames to leave the machine
        - label: It does not require reading prompts, transcripts or file contents
